services:
  db:
    image: postgres:15
    container_name: buxium-db
    restart: always
    environment:
      POSTGRES_DB: buxium_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abdoul1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - buxium-network

  redis:
    image: redis:7-alpine
    container_name: buxium-redis
    restart: unless-stopped
    networks:
      - buxium-network

  backend:
    build: ./backend
    container_name: buxium-backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"  # ← runserver pour debug
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
    depends_on:
      - db
      - redis
    networks:
      - buxium-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: buxium-frontend
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - buxium-network

volumes:
  postgres_data:

networks:
  buxium-network:
    driver: bridge